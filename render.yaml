services:
  - type: web
    name: portopedia-api
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run db:generate --workspace=@portopedia/api && npm run db:migrate --workspace=@portopedia/api && npm run build --workspace=@portopedia/api && npm prune --omit=dev
    startCommand: npm run start --workspace=@portopedia/api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Portopedia
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false

  - type: web
    name: portopedia-web
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run build --workspace=@portopedia/web && npm prune --omit=dev
    startCommand: npm run start --workspace=@portopedia/web
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NEXT_PUBLIC_API_URL
        sync: false
