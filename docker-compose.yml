services:
  postgres:
    image: postgres:16-alpine
    container_name: portopedia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portopedia
      POSTGRES_USER: portopedia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portopedia_local}
    ports:
      - "5432:5432"
    volumes:
      - portopedia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portopedia -d portopedia"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    container_name: portopedia-migrate
    command: ["npm", "run", "db:migrate", "--workspace=@portopedia/api"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://portopedia:${POSTGRES_PASSWORD:-portopedia_local}@postgres:5432/portopedia
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: portopedia-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://portopedia:${POSTGRES_PASSWORD:-portopedia_local}@postgres:5432/portopedia
      WEB_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: portopedia-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  portopedia_postgres_data:
