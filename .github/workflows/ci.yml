name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Type-check
        run: npm run typecheck
      - name: Run API tests
        run: npm test
      - name: Lint web application
        run: npm run lint
      - name: Build production applications
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/portopedia
          NEXT_PUBLIC_API_URL: http://localhost:4000
